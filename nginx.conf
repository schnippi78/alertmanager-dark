worker_processes 1;
error_log /dev/stderr warn;
pid /tmp/nginx.pid;

events { worker_connections 1024; }

http {
    include       /etc/nginx/mime.types;
    default_type  application/octet-stream;
    access_log    off;
    sendfile      on;

    # Als non-root (nobody) laufen -> alle Temp-Pfade nach /tmp
    client_body_temp_path /tmp/nginx-client;
    proxy_temp_path       /tmp/nginx-proxy;
    fastcgi_temp_path     /tmp/nginx-fastcgi;
    uwsgi_temp_path       /tmp/nginx-uwsgi;
    scgi_temp_path        /tmp/nginx-scgi;

    server {
        # Dual-Stack: IPv4 + IPv6. Wichtig, weil 'localhost' im Container zu ::1
        # aufloest und der Swarm-Healthcheck sonst 'Connection refused' bekommt.
        listen 9093;
        listen [::]:9093;
        server_name _;

        # Injiziertes Darkmode-Stylesheet
        location = /am-dark.css {
            alias /usr/share/am-dark/am-dark.css;
            types { } default_type text/css;
            add_header Cache-Control "public, max-age=86400";
        }

        # Alles andere -> Alertmanager (intern auf 9095; 9094 bleibt fuer Cluster-Gossip frei)
        location / {
            proxy_pass http://127.0.0.1:9095;
            proxy_http_version 1.1;
            proxy_set_header Host              $host;
            proxy_set_header X-Real-IP         $remote_addr;
            proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            # Upstream-Kompression aus, damit sub_filter matchen kann
            proxy_set_header Accept-Encoding   "";

            # Dark-CSS vor </head> einhaengen (text/html ist Default fuer sub_filter_types)
            sub_filter_once on;
            sub_filter '</head>' '<link rel="stylesheet" href="/am-dark.css"></head>';
        }
    }
}
